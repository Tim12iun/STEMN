[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stemn"
version = "0.1.0"
description = "Zerlegt Drum-Loops in Kick, Snare, Hi-Hat, Toms und Becken (lokal, offline)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "audio-separator[cpu]>=0.40",
    "soundfile>=0.12",
    "numpy>=1.24",
    "pyyaml>=6",
    "certifi",                  # Zertifikate fuer die Update-Pruefung in der fertigen App
    "audioread>=3",
    "PySide6-Essentials>=6.6",  # Oberflaeche
    "sounddevice>=0.4",         # Wiedergabe (bringt PortAudio auf Mac/Windows mit)  # audio-separator importiert es, librosa 1.x bringt es nicht mehr mit
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stemn = "stemn.cli:main"

[project.gui-scripts]
stemn-app = "stemn.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stemn = ["fonts/*.ttf", "fonts/OFL.txt", "assets/*.png", "assets/*.icns", "assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
