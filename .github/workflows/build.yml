name: Build

# Baut fertige Pakete fuer Mac (Apple Silicon) und Windows, inkl. Modell.
# Manuell starten (optional mit Versionsnummer -> Release) oder per Tag v*.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer fuer ein Release, z.B. 0.2.0 (leer = nur bauen)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: stemn-macos-arm64
          - os: windows-latest
            name: stemn-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e . pyinstaller "setuptools<81"
      - uses: actions/cache@v4
        with:
          path: models/**/*.ckpt
          key: models-${{ hashFiles('models/*/stemn-model.yaml') }}
      - run: python scripts/fetch_models.py
      - name: Update-Token einbauen (nur Lesezugriff auf dieses Repo)
        shell: bash
        env:
          TOKEN: ${{ secrets.STEMN_UPDATE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "::warning::Secret STEMN_UPDATE_TOKEN fehlt, automatische Updates sind im Paket aus"; fi
          printf 'TOKEN = "%s"\n' "$TOKEN" > src/stemn/_build_token.py
      - name: Version setzen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          sed -i.bak "s/^__version__ = .*/__version__ = \"$v\"/" src/stemn/__init__.py && rm src/stemn/__init__.py.bak
      - name: PyInstaller (App mit Fenster)
        run: >
          pyinstaller --noconfirm --clean --windowed --name stemn
          --osx-bundle-identifier de.stemn.app
          --collect-all audio_separator
          --hidden-import stemn._build_token
          --collect-data librosa
          --copy-metadata audio-separator
          --add-data "models${{ runner.os == 'Windows' && ';' || ':' }}models"
          --add-data "src/stemn/fonts${{ runner.os == 'Windows' && ';' || ':' }}stemn/fonts"
          scripts/stemn_entry.py
      - name: Mac-App Version eintragen und neu signieren
        if: runner.os == 'macOS'
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+)\"', open('src/stemn/__init__.py').read()).group(1))")
          plutil -replace CFBundleShortVersionString -string "$v" dist/stemn.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$v" dist/stemn.app/Contents/Info.plist
          codesign --force --deep -s - dist/stemn.app
          plutil -p dist/stemn.app/Contents/Info.plist | grep -i version
      - name: Smoke-Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=./dist/stemn/stemn.exe; else EXE=./dist/stemn.app/Contents/MacOS/stemn; fi
          "$EXE" --selftest-gui
          python -c "import numpy as np, soundfile as sf; sf.write('smoke.wav', np.zeros((44100,2),'float32'), 44100)"
          "$EXE" separate smoke.wav -s kick -o smoke-out --result-file smoke.json
          ls smoke-out | grep -q "kick"
          grep -q '"stems"' smoke.json
      - name: Packen
        shell: bash
        run: |
          cd dist
          # volles Paket (mit Modell) und kleines App-Paket (ohne Modellgewichte) fuer Updates
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.name }}.zip stemn
            7z a ../${{ matrix.name }}-app.zip stemn '-xr!*.ckpt' '-xr!*.th'
          else
            ditto -c -k --keepParent stemn.app ../${{ matrix.name }}.zip
            zip -qry ../${{ matrix.name }}-app.zip stemn.app -x '*.ckpt' '*.th'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: "*.zip"
